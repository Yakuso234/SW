services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: yh
      MYSQL_USER: ${MYSQL_USERNAME:?请在 .env 中设置 MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "${SW_MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./.file/sql/yh.sql:/docker-entrypoint-initdb.d/01-yh.sql:ro

  redis:
    image: redis:7.2-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
    ports:
      - "${SW_REDIS_PORT:-16379}:6379"

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${MQ_USERNAME:?请在 .env 中设置 MQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${MQ_PASSWORD:?请在 .env 中设置 MQ_PASSWORD}
    ports:
      - "${SW_RABBITMQ_PORT:-25672}:5672"
      - "${SW_RABBITMQ_MANAGEMENT_PORT:-25673}:15672"

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?请在 .env 中设置 MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?请在 .env 中设置 MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    ports:
      - "${SW_MINIO_PORT:-29000}:9000"
      - "${SW_MINIO_CONSOLE_PORT:-29001}:9001"
    volumes:
      - minio-data:/data

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd --advertise-client-urls=http://127.0.0.1:2379 --listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    volumes:
      - milvus-etcd-data:/etcd

  milvus:
    image: milvusdb/milvus:v2.4.20
    command: ["milvus", "run", "standalone"]
    depends_on: [milvus-etcd, minio]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?请在 .env 中设置 MINIO_ACCESS_KEY}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?请在 .env 中设置 MINIO_SECRET_KEY}
    ports:
      - "${SW_MILVUS_PORT:-19530}:19530"
    volumes:
      - milvus-data:/var/lib/milvus

  nacos:
    image: nacos/nacos-server:v2.5.0
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "${SW_NACOS_PORT:-28848}:8848"
      - "${SW_NACOS_GRPC_PORT:-29848}:9848"

  prometheus:
    image: prom/prometheus:v2.53.1
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./.file/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.1.0
    profiles: [observability]
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./.file/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./.file/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

  gateway:
    image: eclipse-temurin:21-jre
    profiles: [app]
    depends_on: [nacos]
    command: java -jar /app/gateway-0.0.1-SNAPSHOT.jar
    ports:
      - "8080:10086"
    volumes:
      - ./gateway/target/gateway-0.0.1-SNAPSHOT.jar:/app/gateway-0.0.1-SNAPSHOT.jar:ro
    environment: &app-env
      MYSQL_USERNAME: ${MYSQL_USERNAME:?请在 .env 中设置 MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
      MQ_USERNAME: ${MQ_USERNAME:?请在 .env 中设置 MQ_USERNAME}
      MQ_PASSWORD: ${MQ_PASSWORD:?请在 .env 中设置 MQ_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?请在 .env 中设置 MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?请在 .env 中设置 MINIO_SECRET_KEY}
      NACOS_USERNAME: ${NACOS_USERNAME:?请在 .env 中设置 NACOS_USERNAME}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?请在 .env 中设置 NACOS_PASSWORD}
      XXL_JOB_ACCESS_TOKEN: ${XXL_JOB_ACCESS_TOKEN:?请在 .env 中设置 XXL_JOB_ACCESS_TOKEN}
      SW_MYSQL_HOST: mysql
      SW_MYSQL_PORT: 3306
      SW_REDIS_HOST: redis
      SW_REDIS_PORT: 6379
      SW_RABBITMQ_HOST: rabbitmq
      SW_RABBITMQ_PORT: 5672
      SW_MINIO_HOST: minio
      SW_MINIO_PORT: 9000
      SW_MILVUS_HOST: milvus
      SW_MILVUS_PORT: 19530
      SW_NACOS_HOST: nacos
      SW_NACOS_PORT: 8848
      SW_NACOS_SERVER_ADDR: nacos:8848
    restart: on-failure

  user-service:
    image: eclipse-temurin:21-jre
    profiles: [app]
    depends_on: [mysql, redis, nacos, minio]
    command: java -jar /app/user-core-0.0.1-SNAPSHOT.jar
    ports:
      - "8081:10088"
    volumes:
      - ./user/user-core/target/user-core-0.0.1-SNAPSHOT.jar:/app/user-core-0.0.1-SNAPSHOT.jar:ro
    environment: *app-env
    restart: on-failure

  video-service:
    image: eclipse-temurin:21-jre
    profiles: [app]
    depends_on: [mysql, redis, rabbitmq, nacos, minio]
    command: java -jar /app/video-0.0.1-SNAPSHOT.jar
    ports:
      - "8082:10091"
    volumes:
      - ./video/video-core/target/video-0.0.1-SNAPSHOT.jar:/app/video-0.0.1-SNAPSHOT.jar:ro
    environment: *app-env
    restart: on-failure

  video-processor:
    build:
      context: ./video-processor
      dockerfile: Dockerfile
    profiles: [app]
    depends_on: [mysql, redis, rabbitmq, nacos]
    environment: *app-env
    restart: on-failure

volumes:
  mysql-data:
  minio-data:
  prometheus-data:
  grafana-data:
  milvus-etcd-data:
  milvus-data:
