server:
  port: 10088
  servlet:
    context-path: /user

spring:
  application:
    name: userService
  profiles:
    active: dev
  cloud:
    nacos:
      username: nacos
      password: nacos
      server-addr: ${SW_NACOS_SERVER_ADDR:localhost:28848}
      config:
        namespace: dev
      discovery:
        namespace: ${spring.cloud.nacos.config.namespace}
  config:
    import:
      - nacos:common-dev.yaml?group=DEFAULT_GROUP&refreshEnabled=true
      - nacos:user-dev.yaml?group=DEFAULT_GROUP&refreshEnabled=true
