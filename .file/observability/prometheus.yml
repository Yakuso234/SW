global:
  scrape_interval: 10s
  scrape_timeout: 5s
  external_labels:
    project: sw
    environment: local

scrape_configs:
  - job_name: sw-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:10086]

  - job_name: sw-video
    metrics_path: /video/api/actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:10091]

  - job_name: sw-video-processor
    metrics_path: /video-processor/api/actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:10092]

  - job_name: sw-ai
    metrics_path: /ai/api/actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:10094]
