spring:
    cloud:
        gateway:
            httpclient:
              websocket:
                max-frame-payload-length: 120000000
            routes:
                - id: userService1
                  uri: lb://userService
                  predicates:
                    - Path=/user/**
                - id: videoService1
                  uri: lb://videoService
                  predicates:
                    - Path=/video/**
                - id: aiService1
                  uri: lb://aiService
                  predicates:
                    - Path=/ai/**

gateway:
    auth:
        excludePaths:
            - /*/api/public/**
            - /*/v3/api-docs/**
    rate-limit:
        enabled: true
        window-seconds: 60
        ip-limit: 120
        user-limit: 60
        route-limit: 300
        protected-methods:
            - POST
            - PUT
            - PATCH
            - DELETE
        protected-path-prefixes:
            - /ai/
        route-limits:
            aiService1: 30

logging:
  level:
    reactor:
      netty: DEBUG
    io:
      netty: DEBUG

knife4j:
  gateway:
    enabled: true
    strategy: discover  # 服务发现模式
    discover:
      enabled: true
      version: openapi3  # 子服务规范: openapi3 或 swagger2
      excluded-services:
        - gateway
