spring:
  r2dbc:
    url: ${AI_R2DBC_URL:r2dbc:mysql://${SW_MYSQL_HOST:localhost}:${SW_MYSQL_PORT:13306}/yh}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    pool:
      enabled: true
      initial-size: 1
      max-size: 5
      validation-query: SELECT 1
      max-idle-time: 30000
  data:
    redis:
      host: ${SW_REDIS_HOST:localhost}
      port: ${SW_REDIS_PORT:16379}
      password: ${REDIS_PASSWORD}
  ai:
    openai:
      api-key: ${QWEN_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        options:
          model: ${AI_CHAT_MODEL:qwen-plus}
          temperature: 0.8
        completions-path: /chat/completions
      embedding:
        options:
          model: text-embedding-v4
          # model: qwen3-embedding:4b
          dimensions: 768
  cloud:
    openfeign:
      client:
        config:
          videoService:
            connectTimeout: 1000
            readTimeout: 2500
sw:
  ai:
    legacy:
      enabled: false
    creator-assistant:
      enabled: true
      stream-timeout-seconds: 45
      max-message-length: 1500
      memory-enabled: true
      session-turns: 8
      session-ttl-hours: 24
      retrieval-top-k: 5
      fallback-limit: 5

milvus:
  uri: ${SW_MILVUS_URI:http://${SW_MILVUS_HOST:localhost}:${SW_MILVUS_PORT:19530}}
  collection: creator_memory
  dimensions: 768
